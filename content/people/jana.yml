name: Jana Elizabeth
roles:
  - Narrator
bio: I’m best known for narrating stories for Storynory - one of the world’s longest running podcasts. People say my voice is rich and soothing, including my singing voice. As you will notice, I have an English accent. I was born in England and I am of Indian heritage which I am very proud of. Earlier in my career I trained as a beauty-therapist specialising in the holistic side… massage and facials, and I've always been interested in well-being. I hope that these relaxing voice-overs contribute to your well-being.
