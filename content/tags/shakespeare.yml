title: Shakespeare
description: Bard, poet, actor - oh yes, and play-write too, William Shakespeare (1564 - 1616), is perhaps the greatest of the great.  His works include Hamlet, Romeo and Juliet, and Macbeth, 154 sonnets, and several narrative poems.  We bring you speeches and sonnets.
