collections:
  - name: podcasts
    label: Podcasts
    label_singular: Episode
    public_route: true
    rss: podcast
    template: podcast
    list_template: episodes
    folder: content/podcasts
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: [title, date, episodeNumber]
    view_filters:
      - label: Drafts
        field: draft
        pattern: true

    fields:
      - name: title
        label: Episode Title
        widget: string
        required: true

      - name: draft
        label: Draft
        widget: boolean
        default: true

      - name: body
        label: Full Transcript / Show Notes
        widget: richtext
        required: false
        hint: Long-form content displayed on the episode page. A full transcript makes the episode searchable.

      - name: excerpt
        label: Excerpt
        widget: text
        required: false
        hint: A short introduction for episode listings and previews.

      - name: description
        label: Podcast Feed Description
        widget: text
        required: false
        hint: Concise episode summary sent to podcast apps and also displayed on the episode page. Do not paste the full transcript here.

      - name: date
        label: Publication Date
        widget: datetime
        required: true

      - name: episodeNumber
        label: Episode Number
        widget: number
        required: false
        value_type: int
        min: 1

      - name: seasonNumber
        label: Season Number
        widget: number
        required: false
        value_type: int
        min: 1

      - name: audio
        label: Full Story Recording — R2 Path or URL
        widget: string
        required: false
        hint: Path relative to the podcast Audio base URL, such as episodes/story.mp3. Full HTTPS URLs also work. Clear Full Story File Size and Full Story Duration when replacing the recording so its metadata can be refreshed.

      - name: length
        label: Full Story File Size (bytes)
        widget: number
        value_type: int
        min: 0
        required: false
        hint: Exact size of the complete recording in bytes, retrieved from the audio host. Clear this when replacing the recording so the metadata can be refreshed. May be entered or corrected manually if unavailable.

      - name: duration
        label: Full Story Duration
        widget: string
        required: false
        hint: Running time of the complete recording in MM:SS or HH:MM:SS. Detected automatically when empty or invalid; may be entered manually. Clear this when replacing the recording.

      - name: sampleAudio
        label: Short Audio Sample — R2 Path or URL
        widget: string
        required: false
        hint: Path relative to the podcast Audio base URL, such as samples/lanval-sample-v4n8r2tz.mp3. Full HTTPS URLs also work. This is a short public preview, not the complete story. Clear Sample File Size and Sample Duration when replacing the sample so its metadata can be refreshed.

      - name: sampleLength
        label: Sample File Size (bytes)
        widget: number
        value_type: int
        min: 0
        required: false
        hint: Exact size of the sample MP3. Clear this when replacing the sample so the metadata can be refreshed.

      - name: sampleDuration
        label: Sample Duration
        widget: string
        required: false
        hint: Running time of the sample in MM:SS or HH:MM:SS. Detected automatically when empty or invalid; may be entered manually. Clear this when replacing the sample.

      - name: permanentlyFree
        label: Keep Full Story Permanently Free
        widget: boolean
        required: false
        default: false
        hint: Keep the complete recording publicly available on the website after it leaves the latest 12 free podcast episodes.

      - name: author
        label: Writer
        widget: relation
        collection: people
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        required: false

      - name: narrator
        label: Narrator
        widget: relation
        collection: people
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        required: false

      - name: presenter
        label: Presenter
        widget: relation
        collection: people
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        required: false

      - name: producer
        label: Producer
        widget: relation
        collection: people
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        required: false

      - name: featuredImage
        label: Cover Art
        widget: image
        required: false

      - name: featuredImageAlt
        label: Cover Art Alt Text
        widget: string
        required: false

      - name: category
        label: Category
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false

      - name: tags
        label: Tags
        widget: relation
        collection: tags
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false

      - name: showOnHome
        label: Show on Homepage
        widget: boolean
        required: false
        default: true

      - name: featured
        label: Featured Episode
        widget: boolean
        required: false
        default: false

      - name: seo
        label: SEO
        widget: object
        required: false
        collapsed: true
        fields:
          - name: title
            label: SEO Title
            widget: string
            required: false
          - name: description
            label: Meta Description
            widget: text
            required: false
