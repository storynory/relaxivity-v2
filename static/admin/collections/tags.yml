
collections:
  - name: tags
    label: Tags
    label_singular: Tag
    folder: content/tags
    create: true
    extension: yml
    format: yaml
    slug: "{{slug}}"
    identifier_field: title

    fields:
      - name: title
        label: Tag Name
        widget: string
        required: true

      - name: description
        label: Description
        widget: text
        required: false

      - name: image
        label: Tag Image
        widget: image
        required: false

      - name: seo
        label: SEO
        widget: object
        collapsed: true
        required: false
        fields:
          - name: title
            label: SEO Title
            widget: string
            required: false

          - name: description
            label: Meta Description
            widget: text
            required: false

