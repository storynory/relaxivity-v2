collections:
  - name: pages
    label: Pages
    public_route: true
    template: page
    folder: content/pages
    create: true
    slug: "{{slug}}"
    fields:
      - name: title
        label: Title
        widget: string

      - name: excerpt
        label: Excerpt
        widget: text
        required: false

      - name: seo
        label: SEO (optional overrides)
        widget: object
        collapsed: true
        required: false
        hint: By default the page title and excerpt are used for search and social sharing.
        fields:
          - name: title
            label: SEO Title
            widget: string
            required: false
            hint: Leave blank to use the page title. Prefer matching the visible heading.
          - name: description
            label: Meta Description
            widget: text
            required: false
            hint: Leave blank to use the excerpt.

      - name: layout
        label: Page Layout
        widget: select
        options:
          - { label: Standard, value: standard }
          - { label: Wide, value: wide }
        default: standard
        required: false
        hint: A presentation choice for this page, independent of the collection template.

      - name: body
        label: Content
        widget: richtext
        required: false

      - name: blocks
        label: Reusable Blocks
        widget: relation
        collection: blocks
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        dropdown_threshold: 0
        multiple: true
        required: false
        hint: Select existing blocks and drag to arrange their order.
