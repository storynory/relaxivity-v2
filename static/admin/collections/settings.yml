
collections:
  - name: settings
    label: Site Settings
    icon: settings

    files:
      - name: general
        label: General Settings
        file: content/settings/general.yml
        format: yaml

        fields:
          - name: siteName
            label: Site Name
            widget: string
            required: true

          - name: tagline
            label: Tagline
            widget: string
            required: false

          - name: siteUrl
            label: Website URL
            widget: string
            required: false

          - name: description
            label: Site Description
            widget: text
            required: false

          - name: siteLogo
            label: Site Logo
            widget: image
            required: false

          - name: favicon
            label: Favicon
            widget: image
            required: false

          - name: defaultImage
            label: Default Social Sharing Image
            widget: image
            required: false

          - name: language
            label: Site Language
            widget: string
            default: en-GB

          - name: homePage
            label: Home Page
            widget: relation
            collection: pages
            value_field: "{{slug}}"
            search_fields: [title]
            display_fields: [title]
            required: true
            hint: Choose the Page shown at the root URL.

          - name: activeScheme
            label: Active Colour Scheme
            widget: relation
            collection: colour-schemes
            value_field: "{{slug}}"
            search_fields:
              - title
            display_fields:
              - title
            required: false


          - name: activeTypography
            label: Active Typography Preset
            widget: relation
            collection: typography
            value_field: "{{slug}}"
            search_fields: [title]
            display_fields: [title]
            required: false
            hint: Select a saved typography preset independently of the colour scheme.

          - name: social
            label: Social Links
            widget: object
            collapsed: true
            required: false
            fields:
              - name: facebook
                label: Facebook URL
                widget: string
                required: false

              - name: instagram
                label: Instagram URL
                widget: string
                required: false

              - name: youtube
                label: YouTube URL
                widget: string
                required: false

              - name: linkedin
                label: LinkedIn URL
                widget: string
                required: false

              - name: x
                label: X (Twitter) URL
                widget: string
                required: false

          - name: footer
            label: Footer
            widget: object
            collapsed: true
            required: false
            fields:
              - name: copyright
                label: Copyright Text
                widget: string
                required: false

              - name: description
                label: Footer Description
                widget: text
                required: false


          - name: rss
            label: RSS Feed
            widget: object
            collapsed: true
            required: false
            fields:
              - name: enabled
                label: Enable RSS feed
                widget: boolean
                default: true

              - name: limit
                label: Number of items
                widget: number
                value_type: int
                min: 1
                default: 20

              - name: content
                label: Feed content
                widget: select
                options:
                  - { label: Summary, value: summary }
                  - { label: Full text, value: full }
                default: summary

          - name: sitemap
            label: XML Sitemap
            widget: object
            collapsed: true
            required: false
            fields:
              - name: enabled
                label: Enable sitemap
                widget: boolean
                default: true


          - name: podcastFeed
            label: Podcast Feed
            widget: object
            collapsed: true
            required: false
            fields:
              - name: enabled
                label: Enable podcast RSS feed
                widget: boolean
                default: true

              - name: limit
                label: Number of episodes
                widget: number
                value_type: int
                min: 1
                default: 20

              - name: title
                label: Podcast title
                widget: string
                required: false

              - name: description
                label: Podcast description
                widget: text
                required: false

              - name: author
                label: Podcast author or organisation
                widget: string
                required: false

              - name: image
                label: Podcast cover art
                widget: image
                required: false

              - name: ownerName
                label: Podcast owner name
                widget: string
                required: false
                hint: Name of the person or organisation managing this podcast.

              - name: ownerEmail
                label: Podcast owner email
                widget: string
                required: false
                hint: Published in the RSS feed. Use a dedicated public contact address, not a private email.

              - name: type
                label: Podcast type
                widget: select
                options:
                  - { label: Episodic, value: episodic }
                  - { label: Serial, value: serial }
                default: episodic
                required: false

              - name: category
                label: Podcast category
                widget: select
                required: false
                options:
                  - Arts
                  - Business
                  - Comedy
                  - Education
                  - Fiction
                  - Government
                  - History
                  - Health & Fitness
                  - Kids & Family
                  - Leisure
                  - Music
                  - News
                  - Religion & Spirituality
                  - Science
                  - Society & Culture
                  - Sports
                  - Technology
                  - True Crime
                  - TV & Film
                hint: Choose an Apple Podcasts top-level category.

              - name: explicit
                label: Explicit content
                widget: boolean
                default: false
